  <circle cx="338" cy="338" r="82" fill="#B2121F" filter="url(#sh2)"/>
  <path d="M318 300 L374 338 L318 376 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round"/>
