    <rect x="144" y="144" width="184" height="26" rx="8" fill="#22303F"/>
    <rect x="144" y="190" width="88" height="70" rx="8" fill="#D9DEE4"/>
    <rect x="246" y="192" width="82" height="12" rx="6" fill="#B8C0CA"/>
