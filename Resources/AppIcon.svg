      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1A1F26" flood-opacity="0.32"/>
    </filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1A1F26" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="50" y="50" width="412" height="412" rx="92" fill="#4A5563" filter="url(#sh)"/>
  <g transform="rotate(-6 236 236)">
