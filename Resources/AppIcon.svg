    <rect x="246" y="240" width="60" height="12" rx="6" fill="#B8C0CA"/>
    <rect x="144" y="280" width="184" height="12" rx="6" fill="#B8C0CA"/>
    <rect x="144" y="304" width="160" height="12" rx="6" fill="#B8C0CA"/>
    <rect x="144" y="328" width="120" height="12" rx="6" fill="#B8C0CA"/>
