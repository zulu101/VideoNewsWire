name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Swift-Version
        run: swift --version

      - name: App bauen
        run: ./Scripts/build-app.sh

      - name: App zippen
        run: ditto -c -k --keepParent build/VideoNewsWire.app build/VideoNewsWire.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VideoNewsWire
          path: build/VideoNewsWire.zip
