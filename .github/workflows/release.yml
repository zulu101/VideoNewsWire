name: Release

# Erstellt ein GitHub-Release mit der fertigen App, sobald ein Versions-Tag gepusht wird:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Version aus dem Tag lesen
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: App bauen
        run: ./Scripts/build-app.sh

      - name: App zippen
        run: ditto -c -k --keepParent build/VideoNewsWire.app "build/VideoNewsWire-${VERSION}.zip"

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: build/VideoNewsWire-${{ env.VERSION }}.zip
          generate_release_notes: true
          body: |
            **Installation:** ZIP herunterladen, entpacken und `VideoNewsWire.app` in den Programme-Ordner ziehen.
            Die App ist nicht notarisiert. Beim ersten Start daher im Terminal einmalig:
            `xattr -dr com.apple.quarantine /Applications/VideoNewsWire.app`

            Voraussetzungen: macOS 26 auf Apple Silicon. Details im README.
